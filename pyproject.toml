[project]
name = "pointsman"
version = "0.1.0"
description = "Routes flutter/flutter GitHub issues to the Flutter team that should own them"
readme = "README.md"
authors = [
    { name = "michael_y8n", email = "121900408+Taylor5132@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pytz>=2026.5",
    "scikit-learn>=1.9.1",
    "tokenizers>=0.23.3",
]

[project.scripts]
pointsman = "pointsman:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
